<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Party Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header id="top-bar">
        <h1>Party Games</h1>
    </header>

    <main id="content">
        <section id="menu">
            <h2>Выбери игру</h2>
            <div class="game-list">
                <button class="game-card" onclick="selectGame('mafia')">
                    <h3>Мафия</h3>
                    <p>Социальная дедукция</p>
                </button>
                <button class="game-card" onclick="selectGame('bunker')">
                    <h3>Бункер</h3>
                    <p>Выживание и обсуждение</p>
                </button>
            </div>

            <div class="mode-block">
                <h2>Режим</h2>
                <button onclick="startLocal()">Локально (одно устройство)</button>

                <div class="online">
                    <button onclick="createLobby()">Создать онлайн‑лобби</button>
                    <input id="joinCode" placeholder="Код комнаты">
                    <button onclick="joinLobby()">Присоединиться</button>
                </div>
            </div>
        </section>

        <section id="game-screen" class="hidden">
            <div id="game-header">
                <span id="game-title"></span>
                <span id="room-code"></span>
            </div>

            <div id="game-area">
                <!-- сюда игры рисуют свой UI -->
            </div>

            <div id="game-controls">
                <!-- общие кнопки / лог -->
                <div id="log"></div>
            </div>
        </section>
    </main>
</div>

<script src="net.js"></script>
<script src="mafia.js"></script>
<script src="bunker.js"></script>
<script src="main.js"></script>
</body>
</html>
